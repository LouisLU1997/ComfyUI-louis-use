[project]
name = "comfyui-louis-use"
version = "1.0.0"
description = "A collection of ComfyUI utility nodes: folder I/O, image crop, color tools, seamless tile, text-driven segmentation and more."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "Pillow>=9.0.0",
    "numpy>=1.24.0",
    "transformers>=4.30.0",
    "huggingface_hub>=0.16.0",
    "torchvision>=0.15.0",
    "aiohttp>=3.8.0",
]

[project.urls]
Repository = "https://github.com/YOUR_USERNAME/comfyui-louis-use"

[tool.comfy]
PublisherId = "louis"
DisplayName = "Louis Use"
Icon = ""
Tags = ["image", "folder", "crop", "color", "segmentation", "seamless", "utility"]
